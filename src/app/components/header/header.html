<header class="fixed top-0 inset-x-0 z-50">
  <!-- DESKTOP -->
  <div class="desktop-header pt-4">
    <div class="mx-auto max-w-6xl px-6">
      <div
        class="rounded-pill transition-all duration-300 will-change-transform overflow-hidden"
        [ngClass]="scrolled()
          ? 'bg-surface/55 backdrop-blur-2xl shadow-[0_18px_50px_rgba(0,0,0,0.18)] scale-[0.985]'
          : 'bg-surface/90 backdrop-blur-xl shadow-soft scale-[1]'"
      >
        <div class="h-20 w-[96%] mx-auto flex items-center justify-between gap-4 rounded-pill px-10">
          <a class="flex items-center shrink-0" routerLink="/" aria-label="Ir a Inicio">
            <img
              src="images/logo.png"
              alt="Logo Dr. Jaime"
              class="h-16 w-auto max-w-[140px] object-contain"
            />
          </a>

          <nav class="flex flex-1 items-center justify-center gap-10 text-[18px] font-bold text-text/70">
            <a class="hover:text-text transition" routerLink="/">Inicio</a>
            <a class="hover:text-text transition" routerLink="/nosotros">Nosotros</a>
            <a class="hover:text-text transition" routerLink="/servicios">Servicios</a>
            <a class="hover:text-text transition" routerLink="/casos-exito">Casos de Éxito</a>
            <a class="hover:text-text transition" routerLink="/pacientes">Pacientes</a>
            <a class="hover:text-text transition" routerLink="/sedes">Sedes</a>
          </nav>

          <a
            class="inline-flex h-[32px] w-[120px] rounded-pill p-[6px] transition hover:brightness-[1.02] shrink-0"
            style="background: rgb(var(--primary));"
            [href]="whatsappHref"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span
              class="inline-flex h-full w-full items-center justify-center rounded-pill text-white font-semibold text-[14px]"
              style="background: rgb(var(--primary));"
            >
              Pide tu cita
            </span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- MOBILE -->
  <div class="mobile-header">
    <div class="mobile-header__bar">
      <a class="mobile-header__logo" routerLink="/" aria-label="Ir a Inicio">
        <img src="images/logo.png" alt="Logo Dr. Jaime" />
      </a>

      <button
        type="button"
        class="mobile-header__menu-btn"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Abrir menú"
      >
        <svg
          *ngIf="!menuOpen()"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path stroke-linecap="round" d="M4 7h16" />
          <path stroke-linecap="round" d="M4 12h16" />
          <path stroke-linecap="round" d="M4 17h16" />
        </svg>

        <svg
          *ngIf="menuOpen()"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path stroke-linecap="round" d="M6 6l12 12" />
          <path stroke-linecap="round" d="M18 6L6 18" />
        </svg>
      </button>
    </div>

    <div *ngIf="menuOpen()" class="mobile-header__panel">
      <nav class="mobile-header__nav">
        <a routerLink="/" (click)="closeMenu()">Inicio</a>
        <a routerLink="/nosotros" (click)="closeMenu()">Nosotros</a>
        <a routerLink="/servicios" (click)="closeMenu()">Servicios</a>
        <a routerLink="/casos-exito" (click)="closeMenu()">Casos de Éxito</a>
        <a routerLink="/pacientes" (click)="closeMenu()">Pacientes</a>
        <a routerLink="/sedes" (click)="closeMenu()">Sedes</a>
      </nav>

      <a
        class="mobile-header__cta"
        [href]="whatsappHref"
        target="_blank"
        rel="noopener noreferrer"
        (click)="closeMenu()"
      >
        Pide tu cita
      </a>
    </div>
  </div>
</header>
